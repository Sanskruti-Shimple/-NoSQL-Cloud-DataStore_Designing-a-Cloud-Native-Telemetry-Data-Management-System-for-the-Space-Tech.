[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mission-telemetry-platform"
version = "0.1.0"
description = "A cloud-ready multi-model satellite telemetry platform."
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiokafka>=0.12,<1",
  "cassandra-driver>=3.29,<4",
  "fastapi>=0.115,<1",
  "neo4j>=5.28,<7",
  "pydantic-settings>=2.7,<3",
  "pymongo>=4.13,<5",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mission_telemetry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
